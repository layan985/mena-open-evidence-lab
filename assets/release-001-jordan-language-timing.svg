<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">Release Forensics 001</title><desc id="d">Four matched Jordan public archive pairs show English-file timestamps 3 to 16 calendar days after Arabic-file timestamps.</desc><rect width="1200" height="630" fill="#f7f5ef"/><text x="72" y="70" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" letter-spacing="2">MENA OPEN DATA &amp; EVIDENCE LAB · RELEASE FORENSICS 001</text><text x="72" y="135" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">The public evidence trail</text><text x="72" y="188" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700">can have a language timestamp.</text><text x="72" y="234" font-family="Arial,Helvetica,sans-serif" font-size="19">Calendar-day gap between matched Arabic and English public-file archive timestamps</text><line x1="72" y1="510" x2="1128" y2="510" stroke="#151515" stroke-width="2"/><rect x="124" y="390" width="130" height="120" fill="#151515"/><rect x="379" y="450" width="130" height="60" fill="#151515"/><rect x="634" y="250" width="130" height="260" fill="#151515"/><rect x="889" y="190" width="130" height="320" fill="#151515"/><text x="164" y="370" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">6</text><text x="419" y="430" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">3</text><text x="667" y="230" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">13</text><text x="922" y="170" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700">16</text><text x="130" y="545" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">CPI · FEB</text><text x="385" y="545" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">CPI · MAR</text><text x="627" y="545" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">LFS · Q4 2025</text><text x="883" y="545" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="700">LFS · Q1 2026</text><text x="72" y="594" font-family="Arial,Helvetica,sans-serif" font-size="14">Measured object: public directory file timestamps. Not asserted to equal first dissemination time in every official channel.</text><text x="1030" y="594" font-family="Arial,Helvetica,sans-serif" font-size="14" text-anchor="end">17 AUG 2026</text></svg>