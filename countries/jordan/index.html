<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jordan — MENA Evidence Lab</title><link rel="stylesheet" href="../../institutional.css"></head><body data-country="Jordan" data-code="JOR"><header class="top"><a href="../"><b>Country rooms</b></a><nav><a href="../../release-calendar.html">Release calendar</a><a href="../../search.html">Search</a></nav></header><main><section class="wrap hero"><div class="k">Country room · JOR</div><h1>Jordan</h1><p class="lede">Country-linked Lab research objects, datasets, sources, methods and institutional records. Room state: source-map-open.</p><div id="objects" class="grid"></div></section></main><script>const country='Jordan',code='JOR';const sources=[['Publication','../../data/publications.json','../../publications.html'],['Release','../../data/releases.json','../../data.html'],['Project','../../data/projects.json','../../projects.html'],['Method','../../data/methods-series.json','../../methods.html']];(async()=>{let out=[];for(const [type,url,base] of sources){try{const j=await(await fetch(url)).json();for(const x of(j.records||[])){const s=JSON.stringify(x).toLowerCase();if(s.includes(country.toLowerCase())||s.includes(code.toLowerCase()))out.push({type,x,base})}}catch(e){}}objects.innerHTML=out.length?out.map(({type,x,base})=>`<article class="card"><div class="k">${type} · ${x.status||x.type||''}</div><h2>${x.title||x.project||x.id}</h2><p>${x.abstract||x.coverage_note||x.research_question||''}</p><a class="card-link" href="${base}${x.id?'#'+x.id:''}">Open record →</a></article>`).join(''):'<article class="card"><h2>No country-specific released object is indexed yet.</h2><p>The source room remains open.</p></article>'})()</script></body></html>
