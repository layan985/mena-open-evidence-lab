[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mena-evidence"
version = "0.2.0"
description = "Validation, access, and provenance tools for the MENA Open Data & Evidence Lab"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pydantic>=2.7", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff==0.16.0", "httpx>=0.27"]

[project.scripts]
mode = "mode.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
