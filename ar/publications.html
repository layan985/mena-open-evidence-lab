<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المنشورات — مختبر أدلة مينا</title><link rel="stylesheet" href="../institutional.css"><style>body{direction:rtl;text-align:right}.k{letter-spacing:0}</style></head><body><header class="top"><a href="index.html"><b>مختبر أدلة مينا</b></a><nav><a href="data.html">البيانات</a><a href="countries/">الدول</a><a href="../citation.html">الاستشهاد</a><a href="../publications.html">English</a></nav></header><main><section class="wrap hero"><div class="k">المنشورات</div><h1>سجلات بحثية قابلة للفحص والاستشهاد.</h1><p class="lede">تعرض هذه الصفحة العناوين والملخصات العربية المتاحة مع الحفاظ على حالة الإصدار والمراجعة والنسخة من السجل الأساسي نفسه.</p><div id="list" class="grid"></div></section></main><footer class="footer">العنوان العربي لا يغير السجل الأساسي أو حالة الإصدار.</footer><script>(async()=>{const [p,t]=await Promise.all([fetch('../data/publications.json').then(r=>r.json()),fetch('../data/i18n-ar.json').then(r=>r.json())]);list.innerHTML=(p.records||[]).map(x=>{const a=t.publications[x.id]||{};return `<article class="card" id="${x.id}"><div class="k">${x.type||''} · ${x.status||''} · ${x.version||''}</div><h2>${a.title||x.title}</h2><p>${a.summary||x.abstract||''}</p><p><strong>حالة المراجعة:</strong> ${x.review_status||'—'}</p><div class="linkrow"><a href="../publications.html#${x.id}">السجل الكامل</a><a href="../citation.html">إنشاء استشهاد</a></div></article>`}).join('')})()</script></body></html>
