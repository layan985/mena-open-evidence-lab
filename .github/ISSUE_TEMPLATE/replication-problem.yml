name: Replication problem
description: Report a reproducibility, environment, code, data or result discrepancy.
title: "Replication problem: "
labels: ["replication"]
body:
  - type: input
    id: object
    attributes:
      label: Research object / replication ID
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, language/runtime, package versions where relevant.
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Observed result / discrepancy
    validations:
      required: true
  - type: checkboxes
    id: disclosure
    attributes:
      label: Disclosure check
      options:
        - label: No confidential, restricted or personal data is included.
          required: true
