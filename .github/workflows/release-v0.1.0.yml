name: release-v0.1.0

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-v0.1.0.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Lab operating-infrastructure release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.1.0 >/dev/null 2>&1; then
            echo 'v0.1.0 already exists; nothing to do.'
            exit 0
          fi
          gh release create v0.1.0 \
            --target "$GITHUB_SHA" \
            --title 'v0.1.0 — Lab, MODERN and Evidence Terminal operating infrastructure' \
            --notes 'First versioned operating-infrastructure release for the MENA Open Data & Evidence Lab. Includes the static Lab/Evidence Terminal prototype and specification, contributor intake and selection/QA materials, tracking registries, Workshop 001 materials, and the founder-authored MENA Labor Intelligence real-data work sample. This release does not claim completed cohorts, independently validated Lab datasets, delivered workshops, institutional partners, outside reviewers or policy users; those remain evidence-gated external outcomes.'
