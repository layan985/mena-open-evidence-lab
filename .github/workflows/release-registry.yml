name: Validate institutional state
on:
  push:
    paths:
      - data/releases.json
      - data/publications.json
      - data/validation.json
      - data/external-use.json
      - data/programs.json
      - data/engagements.json
      - programs/modern/workshops/001/DELIVERY_RECORD.md
      - scripts/validate-release-registry.mjs
      - scripts/validate-institutional-state.mjs
      - .gitignore
  pull_request:
    paths:
      - data/releases.json
      - data/publications.json
      - data/validation.json
      - data/external-use.json
      - data/programs.json
      - data/engagements.json
      - programs/modern/workshops/001/DELIVERY_RECORD.md
      - scripts/validate-release-registry.mjs
      - scripts/validate-institutional-state.mjs
      - .gitignore
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/validate-release-registry.mjs
      - run: node scripts/validate-institutional-state.mjs
