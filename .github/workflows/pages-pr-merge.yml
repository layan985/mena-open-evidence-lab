name: Deploy Lab site to GitHub Pages on merged PR

on:
  pull_request:
    types: [closed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.pull_request.merged == true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout merged main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate Measurement Anomaly 001 release
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-release-registry.mjs
          node scripts/validate-institutional-state.mjs
          test -f CNAME
          grep -Fxq 'menaevidencelab.org' CNAME
          test -f evidence/saudi-gdp-revision-2023.html
          grep -Fq 'Saudi Arabia’s 2023 GDP changed sign.' evidence/saudi-gdp-revision-2023.html
          test -f vintage-vault.html
          grep -Fq 'MENA Vintage Vault' vintage-vault.html
          test -f mena-rtd.html
          grep -Fq 'What was actually knowable on date d?' mena-rtd.html
          test -f data/saudi-gdp-2023-vintage-pair.csv
          grep -Fq 'SAU-GDP-2023-REAL-PRE' data/saudi-gdp-2023-vintage-pair.csv

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Probe custom-domain release
        continue-on-error: true
        shell: bash
        run: |
          set -u
          curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            'https://menaevidencelab.org/evidence/saudi-gdp-revision-2023.html?deploy=${{ github.sha }}' \
            | grep -F 'Saudi Arabia’s 2023 GDP changed sign.'
