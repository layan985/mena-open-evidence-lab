name: Deploy Lab site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployable institutional state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-release-registry.mjs
          node scripts/validate-institutional-state.mjs
          test -f CNAME
          grep -Fxq 'menaevidencelab.org' CNAME
          grep -Fq '"canonical": true' data/releases.json
          grep -Fq '"id": "engagement-001"' data/engagements.json
          grep -Fq '"status": "active"' data/engagements.json
          grep -Fq 'The economy changes. So does the machinery used to measure it.' index.html
          grep -Fq 'Three assets. One measurement stack.' index.html
          test -f measurement-economics.html
          grep -Fq 'Measurement economics for MENA.' measurement-economics.html
          test -f vintage-vault.html
          grep -Fq 'MENA Vintage Vault' vintage-vault.html
          test -f mena-cal.html
          grep -Fq 'MENA-CAL' mena-cal.html
          test -f methodology-registry.html
          grep -Fq 'MENA Methodology Shock Registry' methodology-registry.html
          test -f data/mena-cal-schema.json
          grep -Fq '"dataset": "MENA-CAL"' data/mena-cal-schema.json
          test -f data/mena-cal-regimes.json
          grep -Fq 'UAE-WORKWEEK-2022-01' data/mena-cal-regimes.json
          test -f data/methodology-shocks.json
          grep -Fq 'MSR-SAU-GDP-CR-2023' data/methodology-shocks.json
          test -f data/statistical-vintages.json
          test -f projects.html
          test -f methods.html
          test -f impact.html
          test -f events.html
          test -f partnerships.html
          test -f annual-report-2026.html
          test -f countries/index.html
          grep -Fq 'Country evidence rooms · 14 economies' countries/index.html
          for country in jordan palestine egypt morocco tunisia saudi-arabia united-arab-emirates lebanon iraq qatar oman bahrain kuwait algeria; do
            test -f "countries/${country}/index.html"
            grep -Fq "href=\"${country}/\"" countries/index.html
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Reassert custom-domain HTTPS
        id: pages_https
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          code="$(curl --silent --show-error --location -o "$response" -w '%{http_code}' -X PUT -H 'Accept: application/vnd.github+json' -H "Authorization: Bearer ${GH_TOKEN}" -H 'X-GitHub-Api-Version: 2026-03-10' "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" -d '{"https_enforced":true}')"
          cat "$response" || true
          echo "GitHub Pages HTTPS update status: ${code}"
          test "$code" = '204'

      - name: Record deployment result
        shell: bash
        run: |
          echo "### GitHub Pages deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact deployment completed for commit \`${GITHUB_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Pages-reported URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "HTTPS reassertion: ${{ steps.pages_https.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose custom domain
        id: custom_domain
        continue-on-error: true
        shell: bash
        run: |
          set -u
          base="https://menaevidencelab.org"
          echo "Resolved addresses:"
          getent ahosts menaevidencelab.org || true
          tls_tmp="$(mktemp)"
          echo | openssl s_client -connect menaevidencelab.org:443 -servername menaevidencelab.org -verify_hostname menaevidencelab.org >"$tls_tmp" 2>&1 || true
          cat "$tls_tmp"
          tls_ok=0
          if grep -Fq 'Verify return code: 0 (ok)' "$tls_tmp"; then tls_ok=1; fi
          probe() {
            local path="$1" expected="$2" tmp code
            tmp="$(mktemp)"
            code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache, no-store, max-age=0' -o "$tmp" -w '%{http_code}' "${base}${path}?build=${GITHUB_SHA}" || printf '000')"
            echo "${path} -> HTTP ${code}"
            if [[ "$code" != "200" ]] || ! grep -Fq "$expected" "$tmp"; then return 1; fi
          }
          failures=0
          if [[ "$tls_ok" -ne 1 ]]; then echo 'TLS hostname verification failed for menaevidencelab.org.' >&2; failures=$((failures+1)); fi
          probe '/' 'The economy changes. So does the machinery used to measure it.' || failures=$((failures+1))
          probe '/measurement-economics.html' 'Measurement economics for MENA.' || failures=$((failures+1))
          probe '/vintage-vault.html' 'MENA Vintage Vault' || failures=$((failures+1))
          probe '/mena-cal.html' 'MENA-CAL' || failures=$((failures+1))
          probe '/methodology-registry.html' 'MENA Methodology Shock Registry' || failures=$((failures+1))
          probe '/data/mena-cal-schema.json' '"dataset": "MENA-CAL"' || failures=$((failures+1))
          probe '/data/methodology-shocks.json' 'MSR-SAU-GDP-CR-2023' || failures=$((failures+1))
          probe '/projects.html' 'Ongoing research is documented before it becomes a paper.' || failures=$((failures+1))
          probe '/methods.html' 'Research Standards Handbook' || failures=$((failures+1))
          probe '/countries/' 'Country evidence rooms · 14 economies' || failures=$((failures+1))
          probe '/countries/jordan/' 'Country evidence room · JOR' || failures=$((failures+1))
          probe '/countries/palestine/' 'Country evidence room · PSE' || failures=$((failures+1))
          probe '/countries/egypt/' 'Country evidence room · EGY' || failures=$((failures+1))
          probe '/countries/morocco/' 'Country evidence room · MAR' || failures=$((failures+1))
          probe '/countries/tunisia/' 'Country evidence room · TUN' || failures=$((failures+1))
          probe '/countries/saudi-arabia/' 'Country evidence room · SAU' || failures=$((failures+1))
          probe '/countries/united-arab-emirates/' 'Country evidence room · ARE' || failures=$((failures+1))
          probe '/countries/lebanon/' 'Country evidence room · LBN' || failures=$((failures+1))
          probe '/countries/iraq/' 'Country evidence room · IRQ' || failures=$((failures+1))
          probe '/countries/qatar/' 'Country evidence room · QAT' || failures=$((failures+1))
          probe '/countries/oman/' 'Country evidence room · OMN' || failures=$((failures+1))
          probe '/countries/bahrain/' 'Country evidence room · BHR' || failures=$((failures+1))
          probe '/countries/kuwait/' 'Country evidence room · KWT' || failures=$((failures+1))
          probe '/countries/algeria/' 'Country evidence room · DZA' || failures=$((failures+1))
          probe '/external-use.html' '2' || failures=$((failures+1))
          probe '/data/releases.json' '"canonical": true' || failures=$((failures+1))
          probe '/data/engagements.json' '"id": "engagement-001"' || failures=$((failures+1))
          probe '/data/projects.json' '"canonical":true' || failures=$((failures+1))
          if [[ "$failures" -gt 0 ]]; then
            echo "CUSTOM_DOMAIN_HEALTH=unhealthy" >> "$GITHUB_ENV"
            echo "Custom-domain probe failed for ${failures} check(s). GitHub Pages deployment itself completed successfully; investigate DNS/proxy/routing separately." >&2
            exit 1
          fi
          echo "CUSTOM_DOMAIN_HEALTH=healthy" >> "$GITHUB_ENV"
          echo "Custom domain, certificate and canonical measurement-economics endpoints are live."

      - name: Summarize custom-domain health
        if: always()
        shell: bash
        run: |
          echo "### Custom-domain health" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${CUSTOM_DOMAIN_HEALTH:-unhealthy}" == "healthy" ]]; then
            echo "✅ \`https://menaevidencelab.org\` served a hostname-valid TLS certificate plus the measurement-economics homepage, three core assets, country routes and canonical state files." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ \`https://menaevidencelab.org\` did not pass one or more TLS/content checks during the post-deploy probe. This is recorded as a domain-health warning rather than a failed Pages artifact deployment." >> "$GITHUB_STEP_SUMMARY"
          fi
