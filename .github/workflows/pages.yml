name: Deploy Lab site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify live custom domain
        shell: bash
        run: |
          set -euo pipefail
          echo "Deployment URL: ${{ steps.deployment.outputs.page_url }}"
          echo "Resolved addresses:"
          getent ahosts menaevidencelab.org || true

          body="$(mktemp)"
          releases="$(mktemp)"
          engagements="$(mktemp)"
          base="https://menaevidencelab.org"

          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' -H 'Pragma: no-cache' \
            "${base}/?build=${GITHUB_SHA}" -o "${body}"
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            "${base}/data/releases.json?build=${GITHUB_SHA}" -o "${releases}"
          curl --fail --silent --show-error --location --retry 6 --retry-all-errors --retry-delay 5 \
            -H 'Cache-Control: no-cache, no-store, max-age=0' \
            "${base}/data/engagements.json?build=${GITHUB_SHA}" -o "${engagements}"

          grep -Fq 'Evidence that can be' "${body}"
          grep -Fq '"canonical": true' "${releases}"
          grep -Fq '"id": "engagement-001"' "${engagements}"
          grep -Fq '"status": "active"' "${engagements}"
          echo "PASS: custom domain and canonical state files are live."
