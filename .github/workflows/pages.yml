name: Deploy Lab site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate deployable institutional state
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-release-registry.mjs
          node scripts/validate-institutional-state.mjs
          test -f CNAME
          grep -Fxq 'menaevidencelab.org' CNAME
          grep -Fq '"canonical": true' data/releases.json
          grep -Fq '"id": "engagement-001"' data/engagements.json
          grep -Fq '"status": "active"' data/engagements.json
          grep -Fq 'Independent evidence infrastructure for MENA economic and policy research.' index.html
          grep -Fq 'Independent users reported' index.html
          test -f projects.html
          test -f methods.html
          test -f impact.html
          test -f events.html
          test -f partnerships.html
          test -f annual-report-2026.html
          test -f countries/index.html
          for country in jordan palestine egypt morocco tunisia saudi-arabia united-arab-emirates lebanon iraq qatar oman bahrain kuwait algeria; do
            test -f "countries/${country}/index.html"
            grep -Fq "href=\"${country}/\"" countries/index.html
          done

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
          name: github-pages-${{ github.run_attempt }}

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Reassert custom-domain HTTPS
        id: pages_https
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          code="$(curl --silent --show-error --location \
            -o "$response" -w '%{http_code}' \
            -X PUT \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages" \
            -d '{"https_enforced":true}')"
          cat "$response" || true
          echo "GitHub Pages HTTPS update status: ${code}"
          test "$code" = '204'

      - name: Record deployment result
        shell: bash
        run: |
          echo "### GitHub Pages deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "Artifact deployment completed for commit \`${GITHUB_SHA}\`." >> "$GITHUB_STEP_SUMMARY"
          echo "Pages-reported URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "HTTPS reassertion: ${{ steps.pages_https.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Diagnose custom domain
        id: custom_domain
        continue-on-error: true
        shell: bash
        run: |
          set -u
          base="https://menaevidencelab.org"
          echo "Resolved addresses:"
          getent ahosts menaevidencelab.org || true

          tls_tmp="$(mktemp)"
          echo | openssl s_client \
            -connect menaevidencelab.org:443 \
            -servername menaevidencelab.org \
            -verify_hostname menaevidencelab.org \
            >"$tls_tmp" 2>&1 || true
          cat "$tls_tmp"
          tls_ok=0
          if grep -Fq 'Verify return code: 0 (ok)' "$tls_tmp"; then
            tls_ok=1
          fi

          probe() {
            local path="$1"
            local expected="$2"
            local tmp
            tmp="$(mktemp)"
            local code
            code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 \
              -H 'Cache-Control: no-cache, no-store, max-age=0' \
              -o "$tmp" -w '%{http_code}' "${base}${path}?build=${GITHUB_SHA}" || printf '000')"
            echo "${path} -> HTTP ${code}"
            if [[ "$code" != "200" ]] || ! grep -Fq "$expected" "$tmp"; then
              return 1
            fi
          }

          failures=0
          if [[ "$tls_ok" -ne 1 ]]; then
            echo 'TLS hostname verification failed for menaevidencelab.org.' >&2
            failures=$((failures+1))
          fi
          probe '/' 'Independent evidence infrastructure for MENA economic and policy research.' || failures=$((failures+1))
          probe '/projects.html' 'Ongoing research is documented before it becomes a paper.' || failures=$((failures+1))
          probe '/methods.html' 'Research Standards Handbook' || failures=$((failures+1))
          probe '/countries/' 'Country research rooms' || failures=$((failures+1))
          probe '/countries/jordan/' 'Country room · JOR' || failures=$((failures+1))
          probe '/countries/egypt/' 'Country room · EGY' || failures=$((failures+1))
          probe '/countries/morocco/' 'Country room · MAR' || failures=$((failures+1))
          probe '/external-use.html' '2' || failures=$((failures+1))
          probe '/data/releases.json' '"canonical": true' || failures=$((failures+1))
          probe '/data/engagements.json' '"id": "engagement-001"' || failures=$((failures+1))
          probe '/data/projects.json' '"canonical":true' || failures=$((failures+1))

          if [[ "$failures" -gt 0 ]]; then
            echo "CUSTOM_DOMAIN_HEALTH=unhealthy" >> "$GITHUB_ENV"
            echo "Custom-domain probe failed for ${failures} check(s). GitHub Pages deployment itself completed successfully; investigate DNS/proxy/routing separately." >&2
            exit 1
          fi

          echo "CUSTOM_DOMAIN_HEALTH=healthy" >> "$GITHUB_ENV"
          echo "Custom domain, certificate and canonical state endpoints are live."

      - name: Summarize custom-domain health
        if: always()
        shell: bash
        run: |
          echo "### Custom-domain health" >> "$GITHUB_STEP_SUMMARY"
          if [[ "${CUSTOM_DOMAIN_HEALTH:-unhealthy}" == "healthy" ]]; then
            echo "✅ \`https://menaevidencelab.org\` served a hostname-valid TLS certificate plus the expected institutional homepage, clean country routes and canonical state files." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "⚠️ \`https://menaevidencelab.org\` did not pass one or more TLS/content checks during the post-deploy probe. This is recorded as a domain-health warning rather than a failed Pages artifact deployment." >> "$GITHUB_STEP_SUMMARY"
          fi
