name: Deploy Lab site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Validate source tree
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-release-registry.mjs
          node scripts/validate-institutional-state.mjs
          test -f CNAME
          grep -Fxq 'menaevidencelab.org' CNAME
          grep -Fq 'The economy changes. So does the machinery used to measure it.' index.html
          test -f measurement-economics.html
          grep -Fq 'Measurement economics for MENA.' measurement-economics.html
          test -f vintage-vault.html
          grep -Fq 'MENA Vintage Vault' vintage-vault.html
          test -f mena-rtd.html
          grep -Fq 'What was actually knowable on date d?' mena-rtd.html
          test -f evidence/saudi-gdp-revision-2023.html
          grep -Fq 'Saudi Arabia’s 2023 GDP changed sign.' evidence/saudi-gdp-revision-2023.html
          test -f data/saudi-gdp-2023-vintage-pair.csv
          grep -Fq 'SAU-GDP-2023-REAL-PRE' data/saudi-gdp-2023-vintage-pair.csv
          test -f data/saudi-gdp-2023-revision-evidence.json
          grep -Fq '"id": "MENALAB-MA-001"' data/saudi-gdp-2023-revision-evidence.json
          test -f data/narrative-reversals.json
          grep -Fq '"id": "NR-SAU-GDP-2023-001"' data/narrative-reversals.json
          echo "SOURCE_SHA=$(git rev-parse HEAD)"

      - name: Assemble canonical static site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir _site
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '_site/' \
            ./ _site/
          sha="$(git rev-parse HEAD)"
          printf '{"repository":"%s","commit":"%s","workflow_run":"%s"}\n' \
            "$GITHUB_REPOSITORY" "$sha" "$GITHUB_RUN_ID" > _site/__deployment.json

      - name: Prove artifact contents before upload
        shell: bash
        run: |
          set -euo pipefail
          echo '=== deployment marker ==='
          cat _site/__deployment.json
          echo '=== required files ==='
          for f in \
            index.html \
            measurement-economics.html \
            vintage-vault.html \
            mena-rtd.html \
            evidence/saudi-gdp-revision-2023.html \
            data/saudi-gdp-2023-vintage-pair.csv \
            data/saudi-gdp-2023-revision-evidence.json \
            data/narrative-reversals.json; do
            test -f "_site/$f"
            printf '%s  %s\n' "$(sha256sum "_site/$f" | cut -d' ' -f1)" "$f"
          done
          grep -Fq 'The economy changes. So does the machinery used to measure it.' _site/index.html
          grep -Fq 'Saudi Arabia’s 2023 GDP changed sign.' _site/evidence/saudi-gdp-revision-2023.html
          grep -Fq 'SAU-GDP-2023-REAL-PRE' _site/data/saudi-gdp-2023-vintage-pair.csv

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload canonical Pages artifact
        id: upload
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages

      - name: Record build artifact
        shell: bash
        run: |
          echo '### Pages build artifact' >> "$GITHUB_STEP_SUMMARY"
          echo "- Source main SHA: \`$(git rev-parse HEAD)\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Artifact ID: \`${{ steps.upload.outputs.artifact_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Artifact contains `__deployment.json` plus Measurement Anomaly 001 routes.' >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy exact build artifact
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages

      - name: Verify live deployment marker and release
        shell: bash
        run: |
          set -euo pipefail
          base='https://menaevidencelab.org'
          expected_sha="${GITHUB_SHA}"
          for attempt in $(seq 1 24); do
            echo "Verification attempt ${attempt}"
            marker="$(mktemp)"
            home="$(mktemp)"
            note="$(mktemp)"
            marker_code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache, no-store, max-age=0' -o "$marker" -w '%{http_code}' "${base}/__deployment.json?run=${GITHUB_RUN_ID}")"
            home_code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache, no-store, max-age=0' -o "$home" -w '%{http_code}' "${base}/?run=${GITHUB_RUN_ID}")"
            note_code="$(curl --silent --show-error --location --connect-timeout 10 --max-time 30 -H 'Cache-Control: no-cache, no-store, max-age=0' -o "$note" -w '%{http_code}' "${base}/evidence/saudi-gdp-revision-2023.html?run=${GITHUB_RUN_ID}")"
            echo "marker=${marker_code} home=${home_code} evidence=${note_code}"
            if [[ "$marker_code" == '200' && "$home_code" == '200' && "$note_code" == '200' ]] \
              && grep -Fq "$expected_sha" "$marker" \
              && grep -Fq 'The economy changes. So does the machinery used to measure it.' "$home" \
              && grep -Fq 'Saudi Arabia’s 2023 GDP changed sign.' "$note"; then
              echo 'LIVE SITE MATCHES THE DEPLOYED ARTIFACT.'
              exit 0
            fi
            echo '--- live marker/body evidence ---'
            cat "$marker" 2>/dev/null || true
            head -c 240 "$home" 2>/dev/null || true; echo
            head -c 240 "$note" 2>/dev/null || true; echo
            sleep 10
          done
          echo 'Pages deployment completed but the custom domain did not serve the deployed artifact marker.' >&2
          exit 1

      - name: Record deployment
        if: always()
        shell: bash
        run: |
          echo '### GitHub Pages deployment' >> "$GITHUB_STEP_SUMMARY"
          echo "- Pages-reported URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow SHA: \`${GITHUB_SHA}\`" >> "$GITHUB_STEP_SUMMARY"
          echo '- Live marker: `https://menaevidencelab.org/__deployment.json`' >> "$GITHUB_STEP_SUMMARY"
          echo '- Evidence route: `https://menaevidencelab.org/evidence/saudi-gdp-revision-2023.html`' >> "$GITHUB_STEP_SUMMARY"
